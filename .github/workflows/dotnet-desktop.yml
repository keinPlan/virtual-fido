name: .NET Desktop Build

on:
  push:
    branches: [ "master" ]
    paths: [ "version.txt" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: VirtualFido.sln
      Gui_Project_Path: VFido.Gui\VFido.Gui.csproj
      Server_Project_Path: VFido.SecretManager.MtlsBasedSecretStoreServer\VFido.SecretManager.MtlsBasedSecretStoreServer.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Determine version
      id: version
      shell: pwsh
      run: |
        $base = (Get-Content version.txt -Raw).Trim()
        $build = "{0:D4}" -f [int]"${{ github.run_number }}"
        $version = "$base+build.$build"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "base=$base" >> $env:GITHUB_OUTPUT
        echo "build=$build" >> $env:GITHUB_OUTPUT

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore -p:Version=${{ steps.version.outputs.version }}

    - name: Test
      run: dotnet test $env:Solution_Name --configuration ${{ matrix.configuration }} --no-build

    - name: Publish GUI (Release only)
      if: matrix.configuration == 'Release'
      run: dotnet publish $env:Gui_Project_Path --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} --output publish\gui

    - name: Publish Server (Release only)
      if: matrix.configuration == 'Release'
      run: dotnet publish $env:Server_Project_Path --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} --output publish\server

    - name: Upload GUI build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: VFido.Gui-${{ steps.version.outputs.base }}-build.${{ steps.version.outputs.build }}-win-x64
        path: publish\gui

    - name: Upload Server build artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: VFido.SecretManager.MtlsBasedSecretStoreServer-${{ steps.version.outputs.base }}-build.${{ steps.version.outputs.build }}-win-x64
        path: publish\server

    - name: Zip published builds
      if: matrix.configuration == 'Release' && github.event_name == 'push'
      run: |
        Compress-Archive -Path publish\gui\* -DestinationPath VFido.Gui-${{ steps.version.outputs.base }}-build.${{ steps.version.outputs.build }}-win-x64.zip
        Compress-Archive -Path publish\server\* -DestinationPath VFido.SecretManager.MtlsBasedSecretStoreServer-${{ steps.version.outputs.base }}-build.${{ steps.version.outputs.build }}-win-x64.zip

    - name: Create GitHub Release
      if: matrix.configuration == 'Release' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ steps.version.outputs.build }}
        name: v${{ steps.version.outputs.base }} (build ${{ steps.version.outputs.build }})
        files: |
          VFido.Gui-${{ steps.version.outputs.base }}-build.${{ steps.version.outputs.build }}-win-x64.zip
          VFido.SecretManager.MtlsBasedSecretStoreServer-${{ steps.version.outputs.base }}-build.${{ steps.version.outputs.build }}-win-x64.zip
